[project]
name = "nodo-core-api"
version = "0.2.0"
description = "NODO CORE - intelligent personal & business operating layer (API + Core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "rapidfuzz>=3.9",
    "tzdata>=2024.1; sys_platform == 'win32'",  # time zones on Windows (night shift schedule)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.45"]   # night shift: real-browser checks (JavaScript errors). Then: python -m playwright install chromium

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nodo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501"]  # FastAPI Depends in defaults; explicit re-raise style; long lines tolerated in data code
